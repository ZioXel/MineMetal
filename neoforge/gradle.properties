org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.configuration-cache=false

minecraft_version=1.21.1
# NeoForge version ATM10 ships with
neo_version=21.1.259

mod_id=minemetal
mod_version=0.1.0-neo-experimental

# ModDevGradle decompiles Minecraft with Java 21; MineMetal itself is compiled with Java 25 (Homebrew JDKs).
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home,/opt/homebrew/opt/openjdk@25/libexec/openjdk.jdk/Contents/Home
org.gradle.java.installations.auto-download=false
